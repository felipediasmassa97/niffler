name: Development

on:
  push:
    branches-ignore: [main]

permissions:
  id-token: write
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/quality-assurance

  test:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-tests
        with:
          streamlit-secrets-toml: ${{ secrets.STREAMLIT_SECRETS_TOML_DEV }}

  deploy-dev:
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/infra-deploy
        with:
          environment: dev
