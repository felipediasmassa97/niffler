[project]
name = "niffler"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = [
    "uv_build>=0.8.15,<0.9.0",
    "setuptools",
]
build_backend = "uv_build"

[tool.uv.build-backend]
module-name = ["app"]

[project.optional-dependencies]
app = [
    "boto3==1.40.*",
    "openpyxl==3.1.2",
    "pandas==2.3.3",
    "plotly==6.5.0",
    "streamlit==1.60.*",
    "unidecode==1.4.0",
]
infra = [
    "aws-cdk-lib==2.266.0",
    "constructs>=10.0.0,<11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.ruff]
lint.select = ["ALL"]
lint.ignore = ["D203", "D213", "TC002", "TC003", "COM812", "CPY001"]

[tool.ruff.lint.per-file-ignores]
# S101: allow assert statements in tests
# ANN401: fixture factories (make_operator, mock_transfers, ...) legitimately take/build
#   heterogeneous row dicts - a concrete union would be less readable than Any here
# PLR2004: expected literals in an assertion are the test, not a magic number to name
"tests/*" = ["S101", "ANN401", "PLR2004"]

[tool.pytest.ini_options]
norecursedirs = "cdk.out node_modules"
pythonpath = [".", "src/app"]
timeout = 120
